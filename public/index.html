<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch Him Code</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#161619" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#e2e2e7" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="view-editor">
    <header class="titlebar">
      <div class="app" id="logo" title="Watch Him Code"></div>
      <nav class="sessions" id="sessions"></nav>
      <button class="session-add" id="session-add" title="Open a session">+</button>
      <div class="session-menu" id="session-menu" hidden></div>
      <div class="tools">
        <button class="update-pill" id="update-pill" hidden title="A new version is available"></button>
        <button class="tool" id="fresh-btn" title="Fresh start: hide this session's earlier changes, show only new ones (c)">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.5 1.5 7 8" /><path d="M4.5 8.5h6l1 6h-8z" /><path d="M6.5 11.5v3M9 11.5v3" />
          </svg>
        </button>
        <button class="live" id="live" title="Follow the latest change (Esc)">
          <span class="dot"></span><span id="live-label">Live</span>
        </button>
        <div class="settings-wrap">
          <button class="tool status-btn" id="status-btn" title="Status – does everything work?">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 8.5h3l1.8-4 3.4 8 1.8-4h3" />
            </svg>
            <span class="badge" id="status-badge"></span>
          </button>
          <div class="settings status" id="status" hidden></div>
        </div>
        <div class="settings-wrap">
          <button class="tool" id="settings-btn" title="Settings">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4">
              <path d="M2 4h7M13 4h1M2 8h2M8 8h6M2 12h8M14 12h0" stroke-linecap="round" />
              <circle cx="11" cy="4" r="1.8" /><circle cx="6" cy="8" r="1.8" /><circle cx="12" cy="12" r="1.8" />
            </svg>
          </button>
          <div class="settings" id="settings" hidden>
            <div class="setting">
              <span>View</span>
              <div class="seg">
                <button data-key="view" data-value="editor">Editor</button>
                <button data-key="view" data-value="cards">Cards</button>
              </div>
            </div>
            <div class="setting">
              <span>Diff</span>
              <div class="seg">
                <button data-key="diff" data-value="new">New</button>
                <button data-key="diff" data-value="inline">Inline</button>
                <button data-key="diff" data-value="split">Side by side</button>
              </div>
            </div>
            <div class="setting">
              <span title="Session: what changed in each file overall (like git diff) · Latest: only the newest edit">Marks</span>
              <div class="seg">
                <button data-key="marks" data-value="session">Whole session</button>
                <button data-key="marks" data-value="latest">Latest edit</button>
              </div>
            </div>
            <div class="setting">
              <span>Show each change</span>
              <div class="slider">
                <input type="range" id="dwell" min="0" max="10" step="0.5" value="3" aria-label="Seconds each change stays on screen" />
                <span id="dwell-label">3 s</span>
              </div>
            </div>
            <div class="setting">
              <span>Close idle tabs</span>
              <div class="seg">
                <button data-key="autoClose" data-value="false">Never</button>
                <button data-key="autoClose" data-value="true">After 1 h</button>
              </div>
            </div>
            <div class="setting">
              <span>Theme</span>
              <div class="seg">
                <button data-key="theme" data-value="light">Light</button>
                <button data-key="theme" data-value="dark">Dark</button>
                <button data-key="theme" data-value="system">System</button>
              </div>
            </div>
            <div class="setting">
              <span>Buddy</span>
              <div class="seg">
                <button data-key="buddy" data-value="true">On</button>
                <button data-key="buddy" data-value="false">Off</button>
              </div>
            </div>
            <div class="setting">
              <span>Avatar</span>
              <div class="seg">
                <button data-key="avatar" data-value="junior">Pixel Junior</button>
                <button data-key="avatar" data-value="werner">Werner</button>
              </div>
            </div>
            <div class="keys"><kbd>Esc</kbd> Live · <kbd>v</kbd> View · <kbd>s</kbd> Diff · <kbd>t</kbd> Theme · <kbd>d</kbd> Demo · <kbd>i</kbd> Status · <kbd>c</kbd> Fresh start</div>
          </div>
        </div>
      </div>
    </header>

    <main class="layout" id="layout">
      <aside class="navigator">
        <div class="resizer" id="resizer" title="Drag to resize · double-click to reset"></div>
        <div class="list" id="list"></div>
        <div class="buddy" id="buddy"></div>
      </aside>
      <section class="editor-area">
        <div class="jumpbar" id="jumpbar"></div>
        <div class="view" id="view"></div>
      </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="logo.js"></script>
    <script src="highlight.js"></script>
    <script src="buddy.js"></script>
    <script src="app.js"></script>
    <script src="demo.js"></script>
  </body>
</html>
